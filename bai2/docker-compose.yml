services:

  nginx:
    image: nginx:alpine
    container_name: ltw-bai2-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./website:/usr/share/nginx/html:ro
    networks:
      - bai1_ltw-network

networks:
  bai1_ltw-network:
    external: true
