<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý tiền phạt sinh viên</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 10px;
        }

        .header p {
            margin: 0;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status {
            margin: 15px 0;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border-bottom: 1px solid #e2e8f0;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #eff6ff;
        }

        .total {
            margin-top: 20px;
            padding: 15px;
            background: #ecfdf5;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Quản lý tiền phạt sinh viên</h1>
        <p>Bài tập 2 - Node-RED + Nginx + JavaScript</p>
    </div>

    <div class="card">

        <button onclick="loadData()">
            Tải danh sách sinh viên
        </button>

        <div id="status">
            Chưa tải dữ liệu.
        </div>

        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Sinh viên</th>
                    <th>Số lần vi phạm</th>
                    <th>Tiền phạt</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>
        </table>

        <div class="total">
            Tổng tiền phạt:
            <span id="totalMoney">0</span> VNĐ
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
